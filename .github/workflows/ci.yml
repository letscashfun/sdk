name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow runs on pull requests from forks, so it must never
# hold a credential that could be exfiltrated by a malicious PR.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # package.json claims `engines: node >=20`. Testing only on 20 makes that
      # claim untested on every version anyone is actually likely to run, so
      # every active line is exercised — 20 as the floor we promise, 24 as the
      # current release.
      matrix:
        node: [20, 22, 24]

    name: check (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly what the lockfile pins, and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve something newer, which is how a build stops matching what was
      # reviewed.
      - run: npm ci

      - run: npm run typecheck

      # Unit tests only. The e2e suite needs an anvil fork of Robinhood Chain
      # and skips itself when none is reachable, so running it here would pass
      # vacuously and read as coverage it did not provide.
      - run: npm run test:unit

      - run: npm run build

      # Nothing ships with a known vulnerability. Runtime dependencies are the
      # ones an installer actually gets, so those are audited strictly; the dev
      # tree is checked too, since that is what has the publish token next to it.
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high

      # The published tarball must contain what we think it does. Printing it
      # on every run makes an accidental inclusion — a .env, a key, a scratch
      # file — visible in the log rather than on the registry. Once is enough;
      # the contents do not vary by Node version.
      - if: matrix.node == 20
        run: npm pack --dry-run
