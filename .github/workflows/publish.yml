name: Publish

# Fires only on a version tag. Publishing is never a side effect of a merge —
# a release is a deliberate act, and `git tag v0.1.0 && git push --tags` is the
# whole ceremony.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # npm's trusted publishing works entirely through this. GitHub mints a
      # short-lived OIDC token, npm checks it against the publisher it has on
      # record for this package — this repository, this workflow file — and
      # accepts the publish on that basis.
      #
      # There is no npm token anywhere in this repository. Nothing to leak,
      # nothing to rotate, nothing to expire. It also sidesteps npm's 2FA
      # requirement on writes, which a stored token cannot satisfy from CI.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 20 ships npm 10, which predates trusted publishing — without an
      # upgrade the publish falls back to looking for a token and fails asking
      # for a one-time password.
      #
      # Pinned to a range rather than `@latest`. npm 12 requires Node 22 or
      # newer, so `@latest` breaks this job the moment npm releases a major
      # that outpaces the Node version here. 11.5.1 is where trusted
      # publishing landed, and npm 11 supports Node 20.
      - name: Use an npm that supports trusted publishing
        run: npm install -g "npm@^11.5.1"

      - run: npm ci

      # Everything again, from a clean checkout. prepublishOnly repeats some of
      # this, but a failure here stops the release before the registry is
      # touched — and a published version cannot be unpublished after 72 hours.
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=low

      # The tag and package.json must agree. Publishing 0.1.0 from a v0.2.0 tag
      # produces a release nobody can trace back to a commit.
      - name: Check the tag matches the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN. Provenance is attached automatically under trusted
      # publishing, and the flag stays as an explicit assertion that a release
      # without it should fail rather than publish silently unattested.
      - run: npm publish --provenance --access public
